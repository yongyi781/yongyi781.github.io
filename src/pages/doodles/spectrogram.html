<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Musical Spectrogram</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        font-family: "Noto Sans", "Lucida Grande", Verdana, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background-color: black;
      }

      #gui {
        float: left;
      }

      #message {
        position: absolute;
        left: 312px;
        top: 0;
        float: right;
        color: white;
      }
    </style>
  </head>

  <body>
    <canvas></canvas>
    <div id="message"></div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"
      integrity="sha512-zInFF17qBFVvvvFpIfeBzo7Tj7+rQxLeTJDmbxjBz5/zIr89YVbTNelNhdTT+/DCrxoVzBeUPVFJsczKbB7sew=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
    <script type="module">
      import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm"

      const canvas = document.querySelector("canvas")
      const offCanvas = new OffscreenCanvas(canvas.width, canvas.height)
      const ctx = canvas.getContext("2d")
      const offCtx = offCanvas.getContext("2d")
      const message = document.querySelector("#message")
      const C0 = 440 / Math.pow(2, 4 + 9 / 12)
      const COLOR_STEPS = 256
      const HUE_STEPS = 256
      /** @type MediaStream */
      let stream
      let source
      /** @type AnalyserNode */
      let analyser
      /** @type Float32Array */
      let freqData
      let linearFreqData
      let imageData
      let historyX = 0
      let renderCacheKey = ""
      let rowSampleIndices
      let rowSampleWeights
      let rowColorOffsets
      let minSampleIndex = 0
      let maxSampleIndex = 0
      let gridLines = []
      let colorLut
      let audioDevices
      /** @type gainNode */
      let gainNode
      let gain = 100
      /** @type OscillatorNode */
      let oscillator
      let lastX,
        lastY,
        lastFreq = 880
      let pauseButton

      let config = {
        audioDevice: "",
        logarithmic: true,
        minFreq: 58,
        maxFreq: 2349,
        sampleRate: 48000,
        gamma: 2.2,
        running: true,
        colorWheelOffset: 0.35,
        fftSize: 13,
        octaveDivision: 12,
        octaveFreq: 440 / Math.pow(2, 9 / 12),
        oscillatorVolume: -35,
        oscillatorType: "sine",
        oscillatorSnap: true,
        pauseOrResume: () => {
          config.running = !config.running
          pauseButton.name(config.running ? "Pause" : "Resume")
        },
        clear: () => {
          offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height)
          historyX = 0
        }
      }
      let audioContext

      function interpolate(min, max, t) {
        t = Math.max(0, Math.min(1, t))
        if (config.logarithmic) return Math.exp((1 - t) * Math.log(min) + t * Math.log(max))
        return (1 - t) * min + t * max
      }

      function reverseInterpolate(min, max, value) {
        if (config.logarithmic) return (Math.log(value) - Math.log(min)) / (Math.log(max) - Math.log(min))
        return (value - min) / (max - min)
      }

      function yToFreq(y) {
        return interpolate(config.minFreq, config.maxFreq, 1 - y / canvas.height)
      }

      function freqToY(freq) {
        return (1 - reverseInterpolate(config.minFreq, config.maxFreq, freq)) * canvas.height
      }

      function getColor(pitch, intensity, alpha = 1) {
        intensity = Math.max(0, Math.min(1, intensity))
        let l = 0.67 * intensity
        let c = 0.2 * intensity
        let h = 360 * ((pitch + config.colorWheelOffset) % 1)
        return chroma.oklch(l, c, h, alpha)
      }

      function createColorLut() {
        const lut = new Uint8ClampedArray(HUE_STEPS * COLOR_STEPS * 3)
        for (let hue = 0; hue < HUE_STEPS; hue++) {
          for (let intensity = 0; intensity < COLOR_STEPS; intensity++) {
            const value = intensity / (COLOR_STEPS - 1)
            const rgb = chroma.oklch(0.67 * value, 0.2 * value, (360 * hue) / HUE_STEPS).rgb()
            const offset = (hue * COLOR_STEPS + intensity) * 3
            lut[offset] = rgb[0]
            lut[offset + 1] = rgb[1]
            lut[offset + 2] = rgb[2]
          }
        }
        return lut
      }

      // Returns 0-1, 0 corresponds to C.
      function getPitch(freq) {
        const pitch = Math.log2(freq / C0)
        return pitch - Math.floor(pitch)
      }

      function roundPitch(freq) {
        return config.octaveDivision === 0
          ? freq
          : Math.pow(
              2,
              Math.round(Math.log2(freq / config.octaveFreq) * config.octaveDivision) / config.octaveDivision
            ) * config.octaveFreq
      }

      function getMusicalPitch(freq) {
        const names = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "G♯", "A", "B♭", "B"]
        const totalCents = Math.log2(freq / C0) * 12
        const pitchClass = (((totalCents + 0.5) % 12) + 12) % 12
        const nearest = Math.floor(pitchClass)
        return {
          name: names[nearest],
          octave: Math.floor((totalCents + 0.5) / 12),
          cents: (pitchClass - nearest) * 100 - 50
        }
      }

      function createAnalyser() {
        if (source != null) {
          source.disconnect()
        }
        analyser = audioContext.createAnalyser()
        analyser.smoothingTimeConstant = 0
        updateFFTSize()
        if (source != null) {
          source.connect(analyser)
        }
      }

      async function setSampleRate(sampleRate) {
        if (config.sampleRate !== sampleRate) {
          config.sampleRate = sampleRate
        }
        if (audioContext != null) {
          await audioContext.close()
          audioContext = null
        }
        await createAudioContext()
      }

      async function createAudioContext() {
        if (audioContext != null) {
          audioContext.close()
          audioContext = null
        }
        try {
          audioContext = new AudioContext({ sampleRate: config.sampleRate })
          if (stream != null) {
            source = audioContext.createMediaStreamSource(stream)
          }
        } catch (e) {
          console.log(`Caught: ${e}`)
          audioContext.close()
          // Probably sample rate not supported.
          audioContext = new AudioContext()
          if (stream != null) {
            source = audioContext.createMediaStreamSource(stream)
          }
        }
        createAnalyser()
      }

      async function setAudioDevice(deviceId) {
        if (source != null) {
          source.disconnect()
        }
        if (stream) {
          for (let t of stream.getTracks()) t.stop()
        }
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: { exact: deviceId },
            channelCount: 1,
            echoCancellation: false,
            autoGainControl: false,
            noiseSuppression: false
          }
        })
        await createAudioContext()
      }

      async function initMicrophoneList() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: true
          })

          const devices = await navigator.mediaDevices.enumerateDevices()
          audioDevices = {}
          for (let d of devices) {
            if (d.kind === "audioinput") {
              audioDevices[d.label] = d.deviceId
            }
          }
          let key = Object.keys(audioDevices).find(s => s.indexOf("Stereo Mix") !== -1)
          config.audioDevice = audioDevices[key] || Object.values(audioDevices)[0]
          await setAudioDevice(config.audioDevice)
        } catch (e) {
          message.textContent = e
        }
      }

      function resizeCanvas() {
        canvas.width = offCanvas.width = window.innerWidth
        canvas.height = offCanvas.height = window.innerHeight
        imageData = ctx.createImageData(1, canvas.height)
        historyX = 0
        renderCacheKey = ""
        ctx.imageSmoothingEnabled = offCtx.imageSmoothingEnabled = false
      }

      function updateFFTSize() {
        if (analyser != null) {
          analyser.fftSize = 2 ** config.fftSize
          freqData = new Float32Array(analyser.frequencyBinCount)
          linearFreqData = new Float32Array(analyser.frequencyBinCount)
          renderCacheKey = ""
        }
      }

      function updateOscillatorFreq(x, y) {
        lastX = x
        lastY = y
        if (oscillator != null) {
          let freq = yToFreq(y)
          if (config.oscillatorSnap) {
            freq = roundPitch(freq)
          }
          oscillator.frequency.value = freq
        }
      }

      function fromDecibels(db) {
        return Math.pow(10, db / 20)
      }

      function updateRenderCache() {
        if (analyser == null || audioContext == null) return

        const key = [
          canvas.height,
          config.logarithmic,
          config.minFreq,
          config.maxFreq,
          config.colorWheelOffset,
          config.octaveDivision,
          config.octaveFreq,
          analyser.frequencyBinCount,
          audioContext.sampleRate
        ].join("|")
        if (key === renderCacheKey) return
        renderCacheKey = key

        const height = canvas.height
        const sampleCount = analyser.frequencyBinCount
        const frequencyToBin = (2 * sampleCount) / audioContext.sampleRate
        rowSampleIndices = new Int32Array(height * 4)
        rowSampleWeights = new Float32Array(height * 4)
        rowColorOffsets = new Uint32Array(height)
        minSampleIndex = sampleCount - 1
        maxSampleIndex = 0

        for (let y = 0; y < height; y++) {
          const freq = yToFreq(y)
          const x = frequencyToBin * freq
          const i = Math.floor(x)
          const t = x - i
          const t2 = t * t
          const t3 = t2 * t
          const offset = y * 4
          rowSampleIndices[offset] = Math.max(0, Math.min(i - 1, sampleCount - 1))
          rowSampleIndices[offset + 1] = Math.max(0, Math.min(i, sampleCount - 1))
          rowSampleIndices[offset + 2] = Math.max(0, Math.min(i + 1, sampleCount - 1))
          rowSampleIndices[offset + 3] = Math.max(0, Math.min(i + 2, sampleCount - 1))
          rowSampleWeights[offset] = -0.5 * t + t2 - 0.5 * t3
          rowSampleWeights[offset + 1] = 1 - 2.5 * t2 + 1.5 * t3
          rowSampleWeights[offset + 2] = 0.5 * t + 2 * t2 - 1.5 * t3
          rowSampleWeights[offset + 3] = -0.5 * t2 + 0.5 * t3
          minSampleIndex = Math.min(minSampleIndex, rowSampleIndices[offset])
          maxSampleIndex = Math.max(maxSampleIndex, rowSampleIndices[offset + 3])

          const hue = (getPitch(freq) + config.colorWheelOffset) % 1
          const hueIndex = Math.floor(hue * HUE_STEPS) % HUE_STEPS
          rowColorOffsets[y] = hueIndex * COLOR_STEPS * 3
        }

        gridLines = []
        if (config.octaveDivision > 0) {
          const minPitch = Math.ceil(Math.log2(config.minFreq / config.octaveFreq) * config.octaveDivision)
          const maxPitch = Math.floor(Math.log2(config.maxFreq / config.octaveFreq) * config.octaveDivision)
          for (let i = minPitch; i <= maxPitch; i++) {
            gridLines.push({
              color: getColor(i / config.octaveDivision, i % config.octaveDivision === 0 ? 1 : 0.4).css(),
              y: Math.round(freqToY(config.octaveFreq * Math.pow(2, i / config.octaveDivision))) + 0.5
            })
          }
        }
      }

      function drawHistory() {
        const rightWidth = offCanvas.width - historyX
        if (rightWidth > 0) {
          ctx.drawImage(offCanvas, historyX, 0, rightWidth, offCanvas.height, 0, 0, rightWidth, canvas.height)
        }
        if (historyX > 0) {
          ctx.drawImage(offCanvas, 0, 0, historyX, offCanvas.height, rightWidth, 0, historyX, canvas.height)
        }
      }

      function render() {
        if (analyser != null) updateRenderCache()
        if (config.running && analyser != null) {
          analyser.getFloatFrequencyData(freqData)
          let maxDb = -Infinity
          for (let i = 0; i < freqData.length; i++) {
            if (freqData[i] > maxDb) maxDb = freqData[i]
          }
          const idealGain = -maxDb
          if (gain < idealGain) {
            gain += Math.min(0.1, idealGain - gain) // Increase gain slowly
          } else if (gain > idealGain) {
            gain = idealGain
          }
          gain = Math.min(100, gain)
          for (let i = minSampleIndex; i <= maxSampleIndex; i++) {
            linearFreqData[i] = fromDecibels(freqData[i])
          }
          const gainMultiplier = fromDecibels(gain)
          // Make h x 1 image data from frequency data
          for (let y = 0, i = 0; y < canvas.height; y++) {
            const offset = y * 4
            const value = Math.max(
              0,
              (linearFreqData[rowSampleIndices[offset]] * rowSampleWeights[offset] +
                linearFreqData[rowSampleIndices[offset + 1]] * rowSampleWeights[offset + 1] +
                linearFreqData[rowSampleIndices[offset + 2]] * rowSampleWeights[offset + 2] +
                linearFreqData[rowSampleIndices[offset + 3]] * rowSampleWeights[offset + 3]) *
                gainMultiplier
            )
            const intensity = Math.min(
              COLOR_STEPS - 1,
              Math.round(Math.pow(value, 1 / config.gamma) * (COLOR_STEPS - 1))
            )
            const colorOffset = rowColorOffsets[y] + intensity * 3
            imageData.data[i++] = colorLut[colorOffset]
            imageData.data[i++] = colorLut[colorOffset + 1]
            imageData.data[i++] = colorLut[colorOffset + 2]
            imageData.data[i++] = 255
          }
          offCtx.putImageData(imageData, historyX, 0)
          historyX = (historyX + 1) % offCanvas.width
        }
        drawHistory()

        // Draw lines
        ctx.lineWidth = 1
        for (const line of gridLines) {
          ctx.strokeStyle = line.color
          ctx.beginPath()
          ctx.moveTo(0, line.y)
          ctx.lineTo(canvas.width, line.y)
          ctx.stroke()
        }

        // Draw frequency text
        const oscY = config.oscillatorSnap ? freqToY(roundPitch(yToFreq(lastY))) : lastY
        let freq = yToFreq(oscY)
        let p = getMusicalPitch(freq)
        let str = `${freq.toFixed(1)} Hz = ${p.name}${p.octave} (${p.cents < 0 ? "−" : "+"}${Math.abs(p.cents.toFixed(0))})`
        ctx.font = "16px 'Open Sans', 'Lucida Grande', 'Verdana', sans-serif"
        let metrics = ctx.measureText(str)
        let x = Math.min(lastX + 6, canvas.width - metrics.width - 3)
        let y = Math.max(oscY - 12, metrics.actualBoundingBoxAscent + 3)
        let color = getColor(getPitch(freq), oscillator == null ? 0.5 : 1)
        ctx.fillStyle = oscillator == null ? "#ccc" : color
        ctx.fillText(str, x, y)

        // Draw frequency circle
        ctx.fillStyle = color
        ctx.beginPath()
        ctx.arc(lastX, oscY, 4, 0, 2 * Math.PI)
        ctx.fill()

        requestAnimationFrame(render)
      }

      window.addEventListener("resize", resizeCanvas)
      canvas.addEventListener("mousedown", e => {
        if (oscillator != null || e.button !== 0) {
          return
        }
        gainNode = audioContext.createGain()
        gainNode.connect(audioContext.destination)
        gainNode.gain.value = 0
        gainNode.gain.linearRampToValueAtTime(fromDecibels(config.oscillatorVolume), audioContext.currentTime + 0.02)
        oscillator = audioContext.createOscillator()
        oscillator.type = config.oscillatorType
        oscillator.connect(gainNode)
        updateOscillatorFreq(e.offsetX, e.offsetY)
        oscillator.start()
      })
      window.addEventListener("mouseup", e => {
        if (oscillator != null && e.button === 0) {
          oscillator.stop()
          oscillator = null
        }
      })
      canvas.addEventListener("mousemove", e => {
        updateOscillatorFreq(e.offsetX, e.offsetY)
      })

      resizeCanvas()
      colorLut = createColorLut()
      document.addEventListener("DOMContentLoaded", async () => {
        setSampleRate(config.sampleRate)
        await initMicrophoneList()

        const gui = new GUI({ name: "GUI", width: 300 })
        gui.domElement.style.left = 0
        gui
          .add(config, "audioDevice", audioDevices)
          .name("Audio device")
          .onFinishChange(() => {
            setAudioDevice(config.audioDevice)
          })
        gui.add(config, "logarithmic").name("Logarithmic scale?")
        const minFreqControl = gui.add(config, "minFreq", 16, 24000, 1)
        const maxFreqControl = gui.add(config, "maxFreq", 16, 24000, 1)
        const sampleRateControl = gui
          .add(config, "sampleRate", 3000, 48000, 1)
          .name("Sample rate")
          .onFinishChange(setSampleRate)
        minFreqControl.name("Min frequency").onFinishChange(() => {
          config.maxFreq = Math.max(config.minFreq, config.maxFreq)
          maxFreqControl.updateDisplay()
        })
        maxFreqControl.name("Max frequency").onFinishChange(() => {
          config.minFreq = Math.min(config.minFreq, config.maxFreq)
          minFreqControl.updateDisplay()
          if (config.sampleRate < 2 * config.maxFreq) {
            setSampleRate(2 * config.maxFreq)
            sampleRateControl.updateDisplay()
          }
        })
        gui.add(config, "gamma", 0.01, 5, 0.001).name("Gamma")
        gui.add(config, "colorWheelOffset", 0, 1, 0.01).name("Color wheel offset")
        gui.add(config, "fftSize", 5, 15, 1).name("FFT size").onFinishChange(updateFFTSize)
        gui.add(config, "octaveDivision", 0, 53, 1).name("Octave division")
        gui.add(config, "octaveFreq", 440 / 2 ** (9 / 12), 1000, 0.01).name("Octave frequency")
        const oscillatorControls = gui.addFolder("Oscillator")
        oscillatorControls.open()
        oscillatorControls.add(config, "oscillatorVolume", -60, 0, 1).name("Oscillator volume")
        oscillatorControls
          .add(config, "oscillatorType", ["sine", "square", "sawtooth", "triangle"])
          .name("Oscillator type")
        oscillatorControls.add(config, "oscillatorSnap").name("Snap oscillator?")
        const controls = gui.addFolder("Controls")
        controls.open()
        pauseButton = controls.add(config, "pauseOrResume").name("Pause")
        controls.add(config, "clear").name("Clear")

        updateFFTSize()
        requestAnimationFrame(render)
      })
    </script>
  </body>
</html>
